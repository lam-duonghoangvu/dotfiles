[tools]
cowsay = "latest"
"github:BetterDiscord/cli" = "latest"
"github:talwat/pokeget-rs" = "latest"

[tasks.bootstrap-personal]
description = "Run bootstrap personal tasks"
run = """
mise run link-beepertexts
mise run link-betterdiscord
mise run link-thunderbird
mise run link-zen
"""

[tasks.link-beepertexts]
description = "Symlink BeeperTexts custom.css to dotfiles"
run = """
mkdir -p "$BEEPERTEXTS_CONFIG_DIR"
ln -sf "$HOME/.dotfiles/config/beepertexts/custom.css" "$BEEPERTEXTS_CONFIG_DIR/custom.css"
"""

[tasks.link-betterdiscord]
description = "Symlink BetterDiscord custom.css to dotfiles"
run = """
mkdir -p "$BETTERDISCORD_CONFIG_DIR/data/stable"
ln -sf "$HOME/.dotfiles/config/betterdiscord/custom.css" "$BETTERDISCORD_CONFIG_DIR/data/stable/custom.css"
"""

[tasks.link-thunderbird]
description = "Symlink Thunderbird user.js and chrome to dotfiles"
run = """
mkdir -p "$THUNDERBIRD_PROFILE_DIR"
ln -sf "$HOME/.dotfiles/config/thunderbird/user.js" "$THUNDERBIRD_PROFILE_DIR/user.js"
ln -sfn "$HOME/.dotfiles/config/thunderbird/chrome" "$THUNDERBIRD_PROFILE_DIR/chrome"
"""

[tasks.link-zen]
description = "Symlink Zen user.js and chrome to dotfiles"
run = """
mkdir -p "$ZEN_PROFILE_DIR"
ln -sf "$HOME/.dotfiles/config/zen/user.js" "$ZEN_PROFILE_DIR/user.js"
ln -sfn "$HOME/.dotfiles/config/zen/chrome" "$ZEN_PROFILE_DIR/chrome"
"""
